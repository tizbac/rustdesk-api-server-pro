signKey: "sercrethatmaycontainch@r$32chars" # this is the token signing key. change this before start server
debugMode: true # debug mode
db:
  driver: "sqlite"
  dsn: "./server.db"
  timeZone: "Europe/Rome" # timezone used for audit/session timestamps (must match the container TZ)
  showSql: false

  # driver: "mysql"
  # dsn: "root:123@tcp(localhost:3306)/test?charset=utf8mb4"
httpConfig:
  printRequestLog: true
  staticdir: "/app/dist"
  port: ":12345" # api server port

smtpConfig:
  host: "127.0.0.1"
  port: 1025
  username: "test"
  password: "test"
  encryption: "none" # none ssl/tls starttls
  from: "test@localhost.com"

jobsConfig:
  deviceCheckJob:
    duration: 30

# the embedded rustdesk web client (served on /web), it is configured by the server
rustdeskWebConfig:
  server: "" # rustdesk rendezvous server, e.g. "hbbs.example.com:21116", empty means the public rustdesk server
  relay: "" # rustdesk relay server, e.g. "hbbr.example.com:21115", empty means the rendezvous server
  key: "" # the base64 encoded public key of your rustdesk server (id_ed25519.pub), empty means the public rustdesk key

# the url used by the devices list to open a peer in the web client
webClient:
  url: "/web/"

ldap:
  enabled: false
  host: "dc.example.com"
  port: 389
  use_tls: false
  start_tls: true
  bind_dn: "CN=admin,OU=Service,DC=example,DC=com"
  bind_password: "password"
  base_dn: "DC=example,DC=com"
  user_filter: "(sAMAccountName=%s)"
  insecure_skip_verify: false
  active_directory: false # set true for Microsoft AD, a bare bind account is then bound as an UPN
